[package]
name = "onv-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "NetBird's relay server in Rust, its QUIC listener on Quinn"

[[bin]]
name = "onv-relay"
path = "src/main.rs"

[dependencies]
# Quinn 0.11.12 with Omnuv's send, seal, receive and decrypt threads
# (safehelm/quinn, branch onv/0.11.12-relay), pinned by commit: the same
# Quinn the Go relay's native listener used.
quinn = { git = "https://github.com/safehelm/quinn", rev = "b2a28f3f64fc71eb93e43362d4239a15b1312baa", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
rustls-native-certs = "0.8"
rustls-acme = { version = "0.15.4", default-features = false, features = ["ring", "tokio", "webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
ring = "0.17"
bytes = "1"
socket2 = "0.6"
base64 = "0.22"
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }

[profile.release]
debug = 1

[workspace]
